<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive meta tag -->
	<title>Add Page</title>
	<link rel="stylesheet" th:href="@{/lib/bootstrap-5/css/bootstrap.min.css}" />
	<style>
		body {
			background-color: #f8f9fa;
			/* Light background color */
		}

		.login-container {
			max-width: 400px;
			/* Maximum width for the container */
			margin: 50px auto;
			/* Centering the container */
			padding: 20px;
			background: #48CFCB;
			border-radius: 5px;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
			/* Subtle shadow */

		}
	</style>
</head>

<body>
	<div class="add">
		<h2 class="text-center">Add</h2>
		<form action="#" th:action="@{/admin/students/add}" method="post" th:object="${student}">
			<div class="mb-3">
				<label for="name" class="form-label">Name</label>
				<input type="text" class="form-control" th:field="*{name}" required placeholder="Enter student Name" />
			</div>
			<div class="mb-3">
				<label for="name" class="form-label">Address</label>
				<input type="text" class="form-control" th:field="*{address}" required
					placeholder="Enter student Address" />
			</div>
			<div class="mb-3">
				<label for="name" class="form-label">Parents Contacts</label>
				<input type="text" class="form-control" th:field="*{parentContactInfo}" required
					placeholder="Enter  ParentsContact" />
			</div>
			<div class="mb-3">
				<label for="name" class="form-label">Grade</label>
				<input type="text" class="form-control" th:field="*{grade}" required placeholder="Enter your Grade" />
			</div>
			<div class="mb-3">
				<label for="dateOfBirth">Date of Birth</label>
				<input type="date" th:field="*{dateOfBirth}" id="dateOfBirth">
				<br><br>
			</div>
			<div class="mb-3">
							<label for="attendance">Attendance</label>
							<input type="text" th:field="*{attendance}" id="attendance">
							<br><br>
						</div>
						<div class="mb-3">
													<label for="date">Date</label>
													<input type="date" th:field="*{date}" id="date">
													<br><br>
												</div>
			<div class="mb-3 ">
				<button type="submit" class="btn btn-primary btn-block w-100">Add New Student</button>
			</div>
			<div th:if="${param.error}" class="text-danger text-center">
				Unable to save New Student.
			</div>
		</form>

	</div>

	<script th:src="@{/lib/bootstrap-5/js/bootstrap.bundle.min.js}"></script> <!-- Bootstrap JS -->
</body>

</html>
